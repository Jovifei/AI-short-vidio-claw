name: Inspect existing provider image
on:
  workflow_dispatch:
  push:
    branches: [codex/oa001-byte-review]
permissions:
  contents: read
jobs:
  receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install image decoder
        run: python -m pip install 'Pillow==12.3.0'
      - name: Collect the already-generated preview (GET only)
        run: python scripts/collect_openart_result.py --fetch --out local/provider_review/OA001
      - uses: actions/upload-artifact@v4
        with:
          name: OA001-provider-receipt
          path: local/provider_review/OA001/
          retention-days: 30
          if-no-files-found: error
