name: Commit actual source PNGs
on:
  push:
    branches: [codex/git-media-assets-20261008]
    paths:
      - config/git_media_bootstrap.json
      - scripts/publish_repo_media.py
      - .github/workflows/git-media-bootstrap.yml
permissions:
  contents: write
concurrency:
  group: one-time-source-media-bootstrap
  cancel-in-progress: false
jobs:
  stage:
    if: github.repository == 'Jovifei/AI-short-vidio-claw' && github.ref == 'refs/heads/codex/git-media-assets-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/git-media-assets-20261008
          persist-credentials: true
      - name: Install deterministic PNG decoder
        run: python -m pip install 'Pillow==12.3.0'
      - name: Fetch already-existing uploaded originals and verify exact bytes
        run: python scripts/publish_repo_media.py --fetch
      - name: Commit real PNG bytes on the staging branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/media/source_library assets/media/git_media_manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'asset: store verified original PNGs in Git, without granting approval'
          git push origin HEAD:refs/heads/codex/git-media-assets-20261008
