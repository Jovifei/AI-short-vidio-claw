name: Committed media and source pilot
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  media_and_contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python -m pip install 'Pillow==12.3.0'
      - name: Legacy V5 and launch regression
        run: |
          python -m unittest discover -s tests -p test_preproduction_v5.py -v
          python -m unittest discover -s tests -p test_launch_readiness.py -v
      - name: 34 new offline cases
        run: python -m unittest discover -s tests -p test_git_media_delivery.py -v
      - name: Import actual committed PNGs twice without download or approval
        run: |
          sha256sum assets/registry/generated_assets_v5.json episodes/LOOKREEL01/approval_manifest_v5.json episodes/EP001/approval_manifest_v5.json > /tmp/before.sha256
          python scripts/sync_repo_media.py --apply
          python scripts/sync_repo_media.py --apply
          python scripts/sync_repo_media.py --check
          python scripts/source_pilot.py review
          sha256sum --check /tmp/before.sha256
      - name: Original episode readiness remains separate
        run: |
          python scripts/validate_production_package.py --project-dir episodes/LOOKREEL01
          python scripts/validate_production_package.py --project-dir episodes/EP001
