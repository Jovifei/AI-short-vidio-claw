name: Preproduction V5 offline checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Python version
        run: python3 --version
      - name: FID1 QA image test dependency
        run: python3 -m pip install 'Pillow>=10,<13'
      - name: Install pinned CPU-only Torch for real FID1 tensor tests
        run: python3 -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.14.1+cpu'
      - name: Verify real CPU tensor runtime
        run: python3 -c "import torch; print(torch.__version__); assert not torch.cuda.is_available()"
      - name: Offline unit tests (no GPU, no downloads)
        run: python3 -m unittest discover -s tests -p 'test_preproduction_v5.py' -v
      - name: FID1 latent contract tests
        run: python3 -m unittest discover -s tests -p '*fid1*unittest.py' -v
      - name: Exact timeline validation
        run: |
          python3 scripts/preproduction.py plan --plan episodes/EP001/production_plan_v5.json
          python3 scripts/preproduction.py plan --plan episodes/LOOKREEL01/production_plan_v5.json
